services:

  db:
    image: pgvector/pgvector:pg15
    container_name: nimbus_db
    ports:
      - "5432:5432"
    environment:
      - POSTGRES_USER=nimbus
      - POSTGRES_PASSWORD=nimbus
      - POSTGRES_DB=nimbus_db
    volumes:
      - postgres_data:/var/lib/postgresql/data

  redis:
    image: redis:7-alpine
    container_name: nimbus_redis
    ports:
      - "6379:6379"

  minio:
    image: minio/minio
    container_name: nimbus_minio
    ports:
      - "9000:9000"
      - "9001:9001"
    environment:
      - MINIO_ROOT_USER=minioadmin
      - MINIO_ROOT_PASSWORD=minioadmin
    command: server /data --console-address ":9001"
    volumes:
      - minio_data:/data

volumes:
  postgres_data:
  minio_data:
